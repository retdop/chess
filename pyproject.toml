[project]
name = "chess-puzzle-rating"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.1.0",
    "python-chess>=1.999",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "modal>=0.73",
]

[tool.uv]
# Ensure the lock file covers all target platforms, including Intel Mac.
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# PyPI has no torch wheel for macOS x86_64 (Intel); use PyTorch's CPU index instead.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
