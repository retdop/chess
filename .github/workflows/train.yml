name: Train

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment folder name under experiments/"
        required: true
        type: string
  workflow_call:
    inputs:
      experiment:
        description: "Experiment folder name under experiments/"
        required: true
        type: string

permissions:
  contents: write

# Runs on a standard GitHub-hosted runner.
# Modal provisions the GPU on demand — no self-hosted runner needed.
# Required secrets: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    environment:
      name: Modal
      deployment: false
    steps:
      - uses: actions/checkout@v4

      - name: Validate experiment
        run: |
          dir="experiments/${{ inputs.experiment }}"
          if [ ! -f "$dir/config.json" ]; then
            echo "::error::Missing config: $dir/config.json"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Train on Modal (GPU)
        run: |
          uv run modal run src/train_modal.py \
            --config "experiments/${{ inputs.experiment }}/config.json"
        env:
          MODAL_TOKEN_ID:     ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Download results from Modal volume
        run: |
          dir="experiments/${{ inputs.experiment }}"
          uv run modal volume get chess-checkpoints /results.json    "$dir/results.json"
          uv run modal volume get chess-checkpoints /stats.json      "$dir/stats.json"
          uv run modal volume get chess-checkpoints /history.json    "$dir/history.json"
          uv run modal volume get chess-checkpoints /predictions.csv "$dir/predictions.csv"

          # Standardized RD<75 results (only exists when training used a higher RD threshold)
          uv run modal volume get chess-checkpoints /results_std75.json "$dir/results_std75.json" || true

          mkdir -p /tmp/plots
          uv run modal volume get chess-checkpoints /scatter.png /tmp/plots/scatter.png
        env:
          MODAL_TOKEN_ID:     ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Upload plots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ inputs.experiment }}
          path: /tmp/plots/
          retention-days: 90

      - name: Commit results
        run: |
          dir="experiments/${{ inputs.experiment }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f "$dir/PENDING"
          git add \
            "$dir/results.json" \
            "$dir/stats.json" \
            "$dir/history.json" \
            "$dir/predictions.csv" \
            "$dir/PENDING"
          # Add standardized results if they exist
          [ -f "$dir/results_std75.json" ] && git add "$dir/results_std75.json"
          git commit -m "results(${{ inputs.experiment }}): add training results"

          # Retry push with rebase in case of concurrent experiment commits
          for i in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            sleep $((2 ** i))
            git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "::error::Failed to push results after retries"
          exit 1
