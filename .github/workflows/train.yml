name: Train

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment folder name under experiments/"
        required: true
        type: string
  workflow_call:
    inputs:
      experiment:
        description: "Experiment folder name under experiments/"
        required: true
        type: string

permissions:
  contents: write

# Runs on a standard GitHub-hosted runner.
# Modal provisions the GPU on demand — no self-hosted runner needed.
# Required secrets: MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    environment:
      name: Modal
      deployment: false
    steps:
      - uses: actions/checkout@v4

      - name: Validate experiment
        run: |
          dir="experiments/${{ inputs.experiment }}"
          if [ ! -f "$dir/config.json" ]; then
            echo "::error::Missing config: $dir/config.json"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Train on Modal (GPU)
        run: |
          cfg="experiments/${{ inputs.experiment }}/config.json"
          epochs=$(jq -r '.epochs // 20' "$cfg")
          batch_size=$(jq -r '.batch_size // 512' "$cfg")
          d_model=$(jq -r '.d_model // 256' "$cfg")
          num_layers=$(jq -r '.num_layers // 6' "$cfg")
          nhead=$(jq -r '.nhead // 8' "$cfg")
          dim_feedforward=$(jq -r '.dim_feedforward // 1024' "$cfg")
          dropout=$(jq -r '.dropout // 0.1' "$cfg")
          lr=$(jq -r '.lr // "1e-3"' "$cfg")
          warmup_frac=$(jq -r '.warmup_frac // 0.1' "$cfg")
          val_frac=$(jq -r '.val_frac // 0.05' "$cfg")
          seed=$(jq -r '.seed // 42' "$cfg")

          uv run modal run src/train_modal.py \
            --epochs         "$epochs"          \
            --batch-size     "$batch_size"      \
            --d-model        "$d_model"         \
            --num-layers     "$num_layers"      \
            --nhead          "$nhead"            \
            --dim-feedforward "$dim_feedforward" \
            --dropout        "$dropout"         \
            --lr             "$lr"              \
            --warmup-frac    "$warmup_frac"     \
            --val-frac       "$val_frac"        \
            --seed           "$seed"
        env:
          MODAL_TOKEN_ID:     ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Download results from Modal volume
        run: |
          dir="experiments/${{ inputs.experiment }}"
          uv run modal volume get chess-checkpoints /results.json "$dir/results.json"
          uv run modal volume get chess-checkpoints /scatter.png  "$dir/scatter.png"
          uv run modal volume get chess-checkpoints /stats.json   "$dir/stats.json"
        env:
          MODAL_TOKEN_ID:     ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Commit results
        run: |
          dir="experiments/${{ inputs.experiment }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f "$dir/PENDING"
          git add "$dir/results.json" "$dir/scatter.png" "$dir/stats.json" "$dir/PENDING"
          git commit -m "results(${{ inputs.experiment }}): add training results"

          # Retry push with rebase in case of concurrent experiment commits
          for i in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            sleep $((2 ** i))
            git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "::error::Failed to push results after retries"
          exit 1
